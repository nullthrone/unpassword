name: Deploy to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            site/package-lock.json
      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.GOOGLE_APP_ID }}
      - name: Build documentation site (app under /app/)
        working-directory: site
        run: |
          npm ci
          node build.mjs --out ../_site --app ../web/dist
          node check.mjs --dir ../_site
      - name: Checksums of every published file
        run: node web/scripts/checksums.mjs _site
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: _site/SHA256SUMS.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
