name: Deploy to GitHub Pages

# The web app (/app/) is always built from a release tag, so every deployed app can be
# verified against a tag. The documentation site is built from the triggering ref:
# - tag v*:        site and app from that tag
# - push to main:  site from main when site inputs changed, app from the latest release tag;
#                  skipped while main has unreleased app changes, so the published docs never
#                  describe an app that is not deployed (they go live with the next tag)
# - manual run:    site from the chosen ref, app from the latest release tag (no skip)
on:
  push:
    tags: ['v*'] # path filters do not apply to tag pushes
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'design/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the app release
        id: release
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          fi
          if [[ -z "$tag" ]]; then
            echo "::error::No release tag v* exists. Tag a release (e.g. v0.1.0) to deploy the app."
            exit 1
          fi
          deploy=true
          if ! git diff --quiet "$tag" HEAD -- web ':(exclude)web/tests' ':(exclude)web/e2e'; then
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then
              deploy=false
              echo "::notice::$GITHUB_REF_NAME has app changes not released in $tag. The documentation goes live with the next release tag, or run this workflow manually."
            else
              echo "::warning::Deploying documentation from $GITHUB_SHA with the app from $tag; the documentation may describe unreleased app changes."
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          {
            echo "| | Ref | Commit |"
            echo "|---|---|---|"
            echo "| Site | \`$GITHUB_REF_NAME\` | \`$GITHUB_SHA\` |"
            echo "| App | \`$tag\` | \`$(git rev-parse "$tag^{commit}")\` |"
            echo
            echo "Deploy: **$deploy**"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        if: steps.release.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            site/package-lock.json
      - name: Build web app from the release tag
        if: steps.release.outputs.deploy == 'true'
        run: |
          git worktree add --detach "$RUNNER_TEMP/release" "$TAG"
          cd "$RUNNER_TEMP/release/web"
          npm ci
          npm test
          npm run build
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.GOOGLE_APP_ID }}
      - name: Build documentation site (app under /app/)
        if: steps.release.outputs.deploy == 'true'
        working-directory: site
        run: |
          npm ci
          node build.mjs --out ../_site --app "$RUNNER_TEMP/release/web/dist"
          node check.mjs --dir ../_site
      - name: Record what the deployment was built from
        if: steps.release.outputs.deploy == 'true'
        run: |
          printf 'site %s %s\napp %s %s\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$TAG" "$(git rev-parse "$TAG^{commit}")" > _site/BUILD.txt
        env:
          TAG: ${{ steps.release.outputs.tag }}
      - name: Checksums of every published file
        if: steps.release.outputs.deploy == 'true'
        run: node web/scripts/checksums.mjs _site
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.deploy == 'true'
        with:
          name: SHA256SUMS
          path: _site/SHA256SUMS.txt
      - uses: actions/upload-pages-artifact@v3
        if: steps.release.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
